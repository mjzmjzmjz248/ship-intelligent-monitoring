# 资料参考参数：取自《船舶智能监控系统技术指南2.0》与 Word 需求清单。
# pending 列出的字段两份资料冲突或未规定，需老师确认后才能当作验收口径。
profile: standard
timezone: Asia/Shanghai
console_port: 8100

device:
  device_id: demo-edge-001
  token_env: DEVICE_TOKEN
  default_token: demo-device-token

vessel:
  vessel_id: demo-vessel-001
  name: 演示船001
  ship_type: 油船

active_camera: bridge-cam-01

cameras:
  - camera_id: bridge-cam-01
    scene: 驾驶室
    name: 驾驶室摄像头
    source: {kind: file, path: data/synthetic_duty.mp4, loop: true, tag: SYNTHETIC}
    roi: {zone_id: bridge-duty-zone, anchor: center, points: [[0.25, 0.1], [0.75, 0.1], [0.75, 0.95], [0.25, 0.95]]}
    alarms: [A1_BRIDGE_ABSENCE, A3_CAMERA_ABNORMAL]
  - camera_id: dutyroom-cam-01
    scene: 企业值班室
    name: 值班室摄像头
    source: {kind: file, path: data/synthetic_duty.mp4, loop: true, tag: SYNTHETIC}
    roi: {zone_id: dutyroom-zone, anchor: center, points: [[0.25, 0.1], [0.75, 0.1], [0.75, 0.95], [0.25, 0.95]]}
    alarms: [A2_DUTYROOM_ABSENCE, A3_CAMERA_ABNORMAL]

detector:
  model: models/yolo11n.pt
  imgsz: 640
  conf: 0.35
  min_box_h: 60
  target_fps: 5
  max_result_age_sec: 1.0

quality:
  no_frame_sec: 2.0
  dark_gray: 15
  dark_ratio: 0.95
  warmup_sec: 6.0

telemetry:
  scenario: configs/scenarios/basic.yaml
  ttl_sec: 3.0
  ais_gap_sec: 3.0
  speed_zones:
    - name: 演示限速区（虚构）
      limit_kn: 8.0
      polygon: [[121.40, 31.20], [121.60, 31.20], [121.60, 31.30], [121.40, 31.30], [121.40, 31.20]]

evidence:
  pre_sec: 5
  post_sec: 5
  fps: 15
  retain_days: 7
  quota_gb: 20

sync:
  shore_url: http://127.0.0.1:8000
  heartbeat_sec: 5
  config_poll_sec: 5
  preview_fps: 2

rules:
  A1_BRIDGE_ABSENCE:
    {trigger_sec: 60, recover_sec: 3, repeat_sec: 60, risk: HIGH,
     basis: "PDF 2.1 第2项：重复间隔1分钟、高风险；触发时限 PDF 只写“规定时限”，60 秒取自 Word 第4项",
     pending: [trigger_sec]}
  A2_DUTYROOM_ABSENCE:
    {trigger_sec: 300, recover_sec: 3, repeat_sec: 900, risk: HIGH,
     basis: "PDF 2.3 第2项：无人员在岗持续5分钟，间隔15分钟，高风险"}
  A3_CAMERA_ABNORMAL:
    {trigger_sec: 30, recover_sec: 3, repeat_sec: 14400, risk: MEDIUM,
     basis: "PDF 2.1 第6项：间隔4小时（值班室 2.3 第3项为2小时）；触发持续时间资料未规定",
     pending: [trigger_sec, repeat_sec]}
  A5_AIS_OFFLINE:
    {trigger_sec: 300, recover_sec: 0, repeat_sec: 14400, risk: MEDIUM,
     basis: "PDF 2.1 第8项：AIS离线5分钟以上，间隔4小时；油船中风险，客船表为高风险"}
  A6_OVERSPEED:
    {trigger_sec: 600, recover_sec: 3, repeat_sec: 300, risk: MEDIUM,
     basis: "PDF 2.1 第5项：建议持续10分钟、间隔5分钟；Word 第10项写持续5分钟",
     pending: [trigger_sec], enter_margin_kn: 0.5, exit_margin_kn: 0.2}

shore:
  offline_after_sec: 1800
  offline_repeat_sec: 14400
  offline_basis: "PDF 2.1 第7项：间隔4小时；离线判定时限 PDF 未规定，1800 秒取自 Word"
  offline_pending: true
  captain_deadline_sec: 900
  late_window_sec: 30
